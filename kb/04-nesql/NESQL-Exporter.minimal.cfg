# Configuration file
#
# NESQL-Exporter — пресет remote-gtnh-control: квесты + NEI + рецепты (vanilla + GT), без Thaumcraft.
# Скопируй в <minecraft>/config/NESQL-Exporter.cfg и перезапусти клиент перед /nesql.
#
# Плагины: base (обязателен), minecraft, nei, gregtech, quest.
# Отключены: thaumcraft (не нужен AspectRecipeIndex), forge (oredict/fluids), mobsinfo, avaritia.

options {
    B:enable_config_file=true
    S:enabled_plugins <
     base
     minecraft
     nei
     gregtech
     quest
     >
}
